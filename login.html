<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Christmas Secret Mission</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <header class="site-header">
      <a class="brand" href="index.html">Christmas Secret Mission</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="character.html">Character</a>
        <a href="mission.html">Mission</a>
        <a href="organizer.html">Organizer</a>
        <a href="#" id="logout-link" class="is-hidden">Logout</a>
      </nav>
    </header>

    <main class="page">
      <h1>Discover Your Christmas Mission 🎄</h1>
      <p>
        Enter your name and your unique 3-digit Christmas code to discover your
        secret character and special holiday mission.
      </p>

      <form class="mission-form" id="login-form">
        <label for="nickname">Your Name</label>
        <input
          id="nickname"
          name="nickname"
          type="text"
          autocomplete="off"
          placeholder="e.g. Abby"
        />

        <label for="code">Your 3-Digit Christmas Code</label>
        <input
          id="code"
          name="code"
          type="text"
          inputmode="numeric"
          pattern="[0-9]{3}"
          maxlength="3"
          autocomplete="off"
          placeholder="e.g. 184"
        />

        <p class="form-error" id="login-error"></p>

        <button type="submit" class="btn btn-primary">
          Reveal My Character 🎄
        </button>
      </form>
    </main>

    <footer class="site-footer">
     <p>🎄 Keep your mission secret until Christmas Day! 🎁</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
